<div class="wd-draft-editor">
  <div class="wd-draft-toolbar" role="toolbar" aria-label="Jegyzet formázása">
    <button type="button" data-cmd="bold" title="Félkövér" aria-label="Félkövér"><strong>B</strong></button>
    <button type="button" data-cmd="italic" title="Dőlt" aria-label="Dőlt"><em>I</em></button>
    <button type="button" data-cmd="underline" title="Aláhúzás" aria-label="Aláhúzás"><u>U</u></button>
    <button type="button" data-cmd="insertUnorderedList" title="Felsorolás" aria-label="Felsorolás">•</button>
    <button type="button" data-cmd="insertOrderedList" title="Számozott lista" aria-label="Számozott lista">1.</button>
    <button type="button" data-cmd="undo" title="Visszavonás" aria-label="Visszavonás">Undo</button>
    <button type="button" data-cmd="redo" title="Újra" aria-label="Újra">Redo</button>
  </div>
  <div
    class="wd-draft-surface"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    aria-label="Jegyzet / vázlat"
    data-placeholder="Jegyzet, vázlat vagy szabad szöveg"
  ></div>
</div>
